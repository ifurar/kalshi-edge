name: refresh board

# Runs the scan + triage + model and publishes the public board to GitHub
# Pages. Manual any time; scheduled a few times over football weekends.
# Each run costs ~6 Odds API credits (one NFL + one CFB call). Bump the
# cron if your Odds API tier allows; trim it in the off-season.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16,20,23 * * 6"   # Saturdays 16:00 / 20:00 / 23:00 UTC (CFB)
    - cron: "0 17,21 * * 0"      # Sundays 17:00 / 21:00 UTC (NFL)
    - cron: "0 23 * * 5"         # Friday night 23:00 UTC

concurrency:
  group: refresh-board
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: scan + triage + build public board
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scan.py --sports nfl,cfb --min-edge 2.0
          python triage.py --scan scan_result.json || true
          python enrich.py || true
          python dashboard.py --public

      - name: commit refreshed data
        run: |
          git config user.name  "kalshi-edge bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scan_result.json triage_result.json enrich.json docs/index.html
          git diff --staged --quiet || git commit -m "refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
